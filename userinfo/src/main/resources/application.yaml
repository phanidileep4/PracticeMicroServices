server:
  port: 9098

# Actuator configuration for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: USER-SERVICE
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://homefood-admin:test123@homefood-cluster.e6yvoz7.mongodb.net/homefooddb?retryWrites=true&w=majority&appName=homefood-cluster}
      database: ${MONGODB_DATABASE:homefooddb}

---
spring:
  config:
    activate:
      on-profile: cloud
  application:
    name: USER-SERVICE
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://homefood-admin:test123@homefood-cluster.e6yvoz7.mongodb.net/homefooddb?retryWrites=true&w=majority&appName=homefood-cluster}
      database: ${MONGODB_DATABASE:homefooddb}

server:
  port: ${PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    hostname: ${HOSTNAME:localhost}
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${vcap.application.instance_id:${spring.application.instance_id:${random.value}}}

---
spring:
  config:
    activate:
      on-profile: docker
  application:
    name: USER-SERVICE
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://homefood-admin:test123@homefood-cluster.e6yvoz7.mongodb.net/homefooddb?retryWrites=true&w=majority&appName=homefood-cluster}
      database: ${MONGODB_DATABASE:homefooddb}

server:
  port: 9098

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/